name: zig build test
on:
  push:
    branches: ["trunk"]
    paths:
      - build.zig
      - build.zig.zon
      - src/**
      - .github/workflows/*
jobs:
  test:
    runs-on: self-hosted
    name: Build and Test
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0-dev.3223+13ad984b1
      - run: zig build test
